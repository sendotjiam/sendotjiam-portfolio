<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="45%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Core Symbol Gradient -->
    <linearGradient id="symbol-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Swift Accent Gradient -->
    <linearGradient id="swift-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <filter id="symbol-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="102"
    ry="102"
    fill="url(#bg-grad)"
    filter="url(#drop-shadow)"
  />

  <!-- Subtle Inner Border Highlight -->
  <rect
    x="33"
    y="33"
    width="446"
    height="446"
    rx="101"
    ry="101"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.2"
    stroke-width="2"
  />

  <!-- Specular Reflection Curve -->
  <path
    d="M 32 134 C 32 78 78 32 134 32 L 378 32 C 434 32 480 78 480 134 C 480 170 380 230 256 230 C 132 230 32 170 32 134 Z"
    fill="url(#shine)"
  />

  <!-- Central Agentic Shield / Radar Contour -->
  <g filter="url(#symbol-glow)">
    <!-- Terminal / Agent Shell Hex Shield Contour -->
    <path
      d="M 256 108 L 380 168 L 380 286 C 380 358 326 414 256 438 C 186 414 132 358 132 286 L 132 168 Z"
      fill="#0f172a"
      fill-opacity="0.38"
      stroke="#60a5fa"
      stroke-width="6"
      stroke-linejoin="round"
    />

    <!-- Swift Bird Stylized Monogram Wing -->
    <path
      d="M 180 280 C 195 240 235 200 300 170 C 275 195 260 215 258 235 C 290 220 325 215 345 220 C 315 245 270 280 240 295 C 215 308 195 300 180 280 Z"
      fill="url(#swift-grad)"
    />

    <!-- Radar / Concurrency Orbit Ring -->
    <ellipse
      cx="256"
      cy="276"
      rx="76"
      ry="36"
      fill="none"
      stroke="#38bdf8"
      stroke-width="4"
      stroke-dasharray="8 6"
      opacity="0.8"
      transform="rotate(-20 256 276)"
    />

    <!-- Prompt / Audit CLI Symbol (>_) -->
    <path
      d="M 200 326 L 230 352 L 200 378"
      fill="none"
      stroke="#ffffff"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <line
      x1="246"
      y1="378"
      x2="280"
      y2="378"
      stroke="#34d399"
      stroke-width="7"
      stroke-linecap="round"
    />
  </g>

  <!-- Top Right Agentic Spark Indicator -->
  <circle cx="370" cy="142" r="10" fill="#38bdf8" />
  <circle cx="370" cy="142" r="18" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
</svg>
